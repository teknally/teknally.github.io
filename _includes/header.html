<style>
  .site-header-nav {
    border-bottom: 1px solid #e8e8e8;
    background: #ffffff;
  }

  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
  }

  .nav-links {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .nav-links a {
    text-decoration: none;
    color: #444;
    font-weight: 500;
    font-size: 0.95rem;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: #000;
  }

  /* Mobile Adjustments */
  @media (max-width: 640px) {
    .header-container {
      flex-direction: column;
      gap: 14px;
      text-align: center;
      padding: 16px 0;
    }

    .nav-links {
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 16px;
    }
  }
</style>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
{% feed_meta %}

<!-- Site Icon / Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon.png' | relative_url }}">
<header class="site-header-nav" role="banner">
  <div class="wrapper header-container">
    <!-- Logo -->
    <a href="/" style="display: flex; align-items: center; text-decoration: none;">
      <img src="/assets/images/logo.svg.svg" alt="Teknally Consulting Group"
        style="height: 200px; width: auto;" />
    </a>

    <!-- Navigation -->
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/research">Research</a>
      <a href="/projects">Projects</a>
      <a href="/consulting">Consulting</a>
      <a href="/about">About</a>
      <a href="/blog">Blog</a>
    </nav>
  </div>
</header>
