<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 60" width="360" height="60">
  <defs>
    <linearGradient id="tekBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="tekCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="tekDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Solid White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Geometric 'T' Mark -->
  <g transform="translate(6, 6)">
    <!-- Top-Left Bar -->
    <path d="M 0 0 L 26 0 L 18 14 L 0 14 Z" fill="url(#tekBlue)" />
    <!-- Top-Right Bar -->
    <path d="M 29 0 L 48 0 L 48 14 L 21 14 Z" fill="url(#tekCyan)" />
    <!-- Vertical Stem -->
    <path d="M 17 18 L 33 18 L 33 48 L 17 48 Z" fill="url(#tekDark)" />
    <!-- Dynamic Accent Blade -->
    <polygon points="11,18 15,18 15,42 11,36" fill="url(#tekCyan)" />
  </g>

  <!-- Corporate Typography -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="800" font-size="23" fill="#0F172A" letter-spacing="1">TEKNALLY</text>
  <text x="69" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="600" font-size="9.5" fill="#64748B" letter-spacing="3.8">CONSULTING GROUP</text>
</svg>
